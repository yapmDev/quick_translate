<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Symbolic icon: only rect/circle/path with a fill are recolored by GTK
       (gtk_icon_info_load_symbolic injects `rect,circle,path { fill: ... }`),
       so no <line> and no strokes. The white fill is just the fallback for
       when recoloring does not kick in.
       Shape: the latin "A" over the CJK glyph 文, i.e. the silhouette of the
       Google Translate mark — the mark itself is two-color and would have to
       be installed under a non-symbolic name, giving up the shell recolor. -->
  <!-- A, drawn as one outline plus its counter (evenodd carves the triangle) -->
  <path fill="#ffffff" fill-rule="evenodd"
        d="M3.3 0.8H5.05L7.35 8.1H5.65L5.22 6.55H3.13L2.7 8.1H1.0Z
           M4.18 2.75L3.47 5.3H4.89Z"/>
  <!-- 文: dot, horizontal stroke, left falling stroke, right falling stroke -->
  <path fill="#ffffff" d="M11.05 7.0H12.35V8.5H11.05Z"/>
  <path fill="#ffffff" d="M8.3 9.1H15.4V10.35H8.3Z"/>
  <path fill="#ffffff" d="M12.5 10.5L13.65 11.15L10.1 15.25L8.95 14.6Z"/>
  <!-- the right stroke starts partway down the left one, so its top edge is
       buried instead of poking out as a peak above the crossing -->
  <path fill="#ffffff" d="M11.75 12.45L12.6 11.75L15.0 14.6L13.9 15.25Z"/>
</svg>
